[workspace]
resolver = "2"
members = [
    "daemon/crates/mblink-core",
    "daemon/crates/mblink-proto",
    "daemon/crates/mblinkd",
    "daemon/crates/mblink",
    "daemon/xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
tokio = { version = "1.54.1", features = ["full"] }
tonic = "0.14.9"
prost = "0.14.4"
clap = { version = "4.6.7", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
notify = "8.2.1"
serde = "1.0.229"
toml = "1.2.1"
tempfile = "3.27.0"
